name: newton-users-test
services:
  database:
    image: postgres:17-alpine
    ports:
      - '127.0.0.1:55439:5432'
    environment:
      POSTGRES_USER: newton
      POSTGRES_PASSWORD: newton-test-only
      POSTGRES_DB: newton_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U newton -d newton_test']
      interval: 2s
      timeout: 5s
      retries: 20
